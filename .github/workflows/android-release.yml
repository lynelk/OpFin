name: Android signed release

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-aab:
    name: Build signed Play bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: google-play-production
    defaults:
      run:
        working-directory: apps/client
    steps:
      - name: Check out exact commit
        working-directory: .
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Install Flutter 3.47.1
        run: |
          git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Restore protected upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          chmod 600 android/upload-keystore.jks
          {
            printf 'storeFile=../upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/key.properties

      - name: Test and build signed app bundle
        env:
          OPFIN_API_BASE_URL: ${{ secrets.OPFIN_API_BASE_URL }}
        run: bash tool/build_release.sh android

      - name: Verify release identity and checksum
        run: |
          bundle='build/app/outputs/bundle/release/app-release.aab'
          test -s "$bundle"
          jarsigner -verify -strict -certs "$bundle"
          apkanalyzer manifest application-id "$bundle" | grep -Fx 'co.opfin.app'
          sha256sum "$bundle" | tee build/app/outputs/bundle/release/app-release.aab.sha256

      - name: Upload controlled release artifact
        uses: actions/upload-artifact@v4
        with:
          name: opfin-google-play-${{ github.sha }}
          path: |
            apps/client/build/app/outputs/bundle/release/app-release.aab
            apps/client/build/app/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: |
          if command -v shred >/dev/null; then
            shred -u android/key.properties android/upload-keystore.jks 2>/dev/null || true
          else
            rm -f android/key.properties android/upload-keystore.jks
          fi
