name: PR142 targeted repair validation
on:
  push:
    branches: [tools/pr142-local-preflight-20261002]
    paths: [.github/workflows/pr142-targeted-repair.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: opfin-pr142-targeted-repair
  cancel-in-progress: false
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opfin_test
          POSTGRES_PASSWORD: ephemeral_validation_only
          POSTGRES_DB: opfin_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U opfin_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EXPECTED_HEAD: d036967fc5f5c0b768fccba0e77b035ed2c893fb
      TARGET_BRANCH: feature/embedded-payroll-deduction
    steps:
      - name: Read current repair scripts without credentials and record their exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tools/pr142-local-preflight-20261002
          path: repair-tools
          persist-credentials: false
      - name: Record the tools revision used by this targeted attempt
        run: git -C repair-tools rev-parse HEAD | tee "$RUNNER_TEMP/TOOLS_COMMIT.txt"
      - name: Check out the exact PR candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d036967fc5f5c0b768fccba0e77b035ed2c893fb
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Apply the complete known repair batch
        working-directory: candidate
        run: bash ../repair-tools/preflight/validate.sh apply
      - name: Run targeted API regressions and changed-file formatting
        working-directory: candidate
        run: bash ../repair-tools/preflight/validate.sh api
      - name: Verify database-sensitive boundaries on ephemeral PostgreSQL
        working-directory: candidate
        run: bash ../repair-tools/preflight/validate.sh postgres
      - name: Reuse previously prepared web and Dart tools without another dependency install
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/reused-tools"
          gh run download 36958561922 --repo lynelk/OpFin --name pr142-web-mobile-tools --dir "$RUNNER_TEMP/reused-tools"
          tar -xJf "$RUNNER_TEMP/reused-tools/node-v22.23.2-linux-x64.tar.xz" -C "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/reused-tools/pr142-web-deps.tgz" -C candidate/apps/web
          tar -xzf "$RUNNER_TEMP/reused-tools/pr142-dart-tools.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v22.23.2-linux-x64/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"
          git -C candidate diff -- apps/web/package.json
          git -C candidate diff --numstat -- apps/web/package-lock.json
      - name: Check Flutter analysis and new financial contracts
        working-directory: candidate
        run: bash ../repair-tools/preflight/validate.sh client
      - name: Check Web types and account-deletion contracts
        working-directory: candidate
        run: bash ../repair-tools/preflight/validate.sh web
      - name: Verify static release and documentation contracts
        working-directory: candidate
        run: bash ../repair-tools/preflight/validate.sh static
      - name: Publish validated code to PR branch only
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'lynelk'
          git config user.email '86437305+lynelk@users.noreply.github.com'
          git add apps/api apps/client apps/web docs scripts .github/workflows/ci.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: complete PR142 account, payroll and release contracts [skip ci]'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD | tee "$RUNNER_TEMP/REPAIR_COMMIT.txt"
      - name: Preserve diagnostics without application environment data
        if: always()
        working-directory: candidate
        run: |
          git add --intent-to-add apps/api apps/client apps/web docs scripts
          git diff --binary "$EXPECTED_HEAD" -- apps/api apps/client apps/web docs scripts .github/workflows/ci.yml > "$RUNNER_TEMP/targeted-repair.patch"
          python3 - <<'PY'
          import os, re, json
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          summary = {}
          for p in root.glob('targeted-*.log'):
              lines = re.sub(r'\x1b\[[0-9;]*m', '', p.read_text(errors='replace')).splitlines()
              summary[p.name] = lines[-55:]
          (root/'targeted-summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY
      - name: Retain compact repair evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr142-targeted-repair-evidence
          path: |
            ${{ runner.temp }}/targeted-*.log
            ${{ runner.temp }}/targeted-summary.json
            ${{ runner.temp }}/targeted-repair.patch
            ${{ runner.temp }}/REPAIR_COMMIT.txt
            ${{ runner.temp }}/TOOLS_COMMIT.txt
          retention-days: 2
          if-no-files-found: warn
