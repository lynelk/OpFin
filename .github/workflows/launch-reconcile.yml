name: Reconcile reviewed launch changes
on:
  push:
    branches: [launch/play-store-v1-materials]
    paths: [.github/workflows/launch-reconcile.yml]
permissions:
  contents: read
jobs:
  reconcile:
    if: github.repository == 'lynelk/OpFin' && github.ref == 'refs/heads/launch/play-store-v1-materials'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Fetch exact reviewed revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=120 origin "$GITHUB_SHA" main
          git checkout -b launch/play-store-v1-materials "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = 96a33a3765621136f735a4720272a1ee2c93511d
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Combine reviewed compliance and presentation changes
        run: |
          set -euo pipefail
          git merge --no-commit --no-ff 96a33a3765621136f735a4720272a1ee2c93511d || test -f .git/MERGE_HEAD
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          allowed = {'apps/client/lib/services/user_session.dart', 'apps/client/lib/loan_application_screen.dart', 'apps/client/lib/product_terms_screen.dart', 'apps/client/pubspec.yaml', 'apps/client/pubspec.lock', 'apps/web/package.json', 'apps/web/package-lock.json'}
          conflicts = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines()
          print('Resolving reviewed overlapping paths:', conflicts)
          if not set(conflicts) <= allowed:
              raise SystemExit('An unreviewed merge conflict requires manual inspection')
          # The new main owns the compliant lending behaviour and package versions.
          # The presentation migration below reapplies tokens without changing it.
          for path in conflicts:
              subprocess.run(['git', 'checkout', '--theirs', '--', path], check=True)
              subprocess.run(['git', 'add', '--', path], check=True)
          session = Path('apps/client/lib/services/user_session.dart')
          text = session.read_text()
          text = text.replace('aOptions: AndroidOptions(),', 'aOptions: AndroidOptions(migrateWithBackup: true),')
          if 'aOptions: AndroidOptions(migrateWithBackup: true)' not in text:
              raise SystemExit('Unexpected secure-storage constructor')
          session.write_text(text)
          package = Path('apps/web/package.json')
          data = json.loads(package.read_text())
          if data['overrides']['sharp'] != '0.35.4':
              raise SystemExit('Unexpected reviewed sharp version')
          data['scripts']['check'] = 'npm run audit && npm run typecheck && npm run lint && npm run test && npm run build'
          data['scripts']['prebuild'] = 'npm audit --audit-level=high'
          package.write_text(json.dumps(data, indent=2) + '\n')
          PY
          python3 scripts/migrate-brand-foundation.py
          python3 scripts/sync-brand.py --check
          python3 scripts/verify-security-controls.py
          git add -- apps/client/lib apps/client/pubspec.yaml apps/web/package.json
          test -z "$(git diff --name-only --diff-filter=U)"
          sh scripts/verify-repository-security.sh
      - name: Record merge on the launch branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git commit -m 'merge: preserve current main lending compliance alongside launch security and branding'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/launch/play-store-v1-materials
          git rev-parse HEAD
