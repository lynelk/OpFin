name: OpFin Monorepo CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: opfin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - run: sh scripts/verify-layout.sh
      - run: python3 scripts/sync-brand.py --check
      - run: python3 scripts/verify-security-controls.py

  repo-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Reject committed secrets and non-source artifacts
        run: sh scripts/verify-repository-security.sh

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=2 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && -n "${GITHUB_BASE_REF:-}" ]]; then
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          fi
      - name: Install PHP 8.2 without Xdebug
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:ondrej/php -y
          sudo apt-get update
          sudo apt-get install -y php8.2-cli php8.2-mbstring php8.2-sqlite3 php8.2-xml php8.2-curl
          sudo update-alternatives --set php /usr/bin/php8.2
          php -v
          composer --version
      - name: Test API
        run: |
          cd apps/api
          composer audit --locked --no-interaction
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate
          sh scripts/enforce-cpay-only.sh
          sh scripts/run-tests.sh
          composer audit
      - name: Check formatting for changed PHP files
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && -n "${GITHUB_BASE_REF:-}" ]]; then
            base="origin/$GITHUB_BASE_REF"
          else
            base="HEAD^"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- apps/api | grep '\.php$' | sed 's#^apps/api/##' || true)
          if [[ "${#files[@]}" -eq 0 ]]; then exit 0; fi
          cd apps/api
          printf 'Checking %s changed PHP files\n' "${#files[@]}"
          ./vendor/bin/pint --test --diff "${files[@]}"

  api-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install integrity-checked Node 22
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.xz
          curl -fsSLO https://nodejs.org/dist/v22.23.2/SHASUMS256.txt
          grep ' node-v22.23.2-linux-x64.tar.xz$' SHASUMS256.txt | sha256sum --check --strict
          tar -xJf node-v22.23.2-linux-x64.tar.xz
          echo "$RUNNER_TEMP/node-v22.23.2-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Audit and build API assets
        run: |
          cd apps/api
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm rebuild
          npm run build

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install integrity-checked Node 22
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.xz
          curl -fsSLO https://nodejs.org/dist/v22.23.2/SHASUMS256.txt
          grep ' node-v22.23.2-linux-x64.tar.xz$' SHASUMS256.txt | sha256sum --check --strict
          tar -xJf node-v22.23.2-linux-x64.tar.xz
          echo "$RUNNER_TEMP/node-v22.23.2-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Install and audit web dependencies
        run: |
          cd apps/web
          npm ci --ignore-scripts --legacy-peer-deps
          npm audit --audit-level=high
          npm rebuild
      - name: Typecheck and lint
        run: |
          cd apps/web
          npm run typecheck
          npm install --no-save --legacy-peer-deps typescript@npm:@typescript/typescript6@6.0.2
          npm run lint
          npm ci --ignore-scripts --legacy-peer-deps
          npm rebuild
      - name: Test and build production web
        run: |
          cd apps/web
          npm run test
          NEXT_PUBLIC_OPFIN_API_URL=https://opfin-production.up.railway.app/api NEXT_PUBLIC_USE_MOCK_API=false OPFIN_ENABLE_DEMO_SHORTCUTS=false npm run build
          if NODE_ENV=production NEXT_PUBLIC_USE_MOCK_API=true node -e "import('./next.config.mjs')"; then exit 1; fi
          if NODE_ENV=production OPFIN_ENABLE_DEMO_SHORTCUTS=true node -e "import('./next.config.mjs')"; then exit 1; fi
      - name: Verify live local production headers and brand assets
        run: |
          cd apps/web
          NEXT_PUBLIC_OPFIN_API_URL=https://opfin-production.up.railway.app/api NEXT_PUBLIC_USE_MOCK_API=false OPFIN_ENABLE_DEMO_SHORTCUTS=false npm run start -- --port 3210 > /tmp/opfin-web-smoke.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python3 ../../scripts/verify-web-response.py http://localhost:3210

  client-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install Flutter 3.47.1
        run: |
          git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Audit, test and build Android
        run: |
          cd apps/client
          flutter --version
          flutter pub get
          git diff --exit-code -- pubspec.lock
          cd ../..
          python3 scripts/audit-pub.py
          cd apps/client
          flutter analyze
          flutter test
          flutter build apk --release --no-pub
          flutter build appbundle --release --no-pub

  client-ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Select Xcode 26+
        run: |
          candidate="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -1)"
          if [[ -n "$candidate" ]]; then sudo xcode-select -s "$candidate/Contents/Developer"; fi
          xcodebuild -version
          major="$(xcodebuild -version | awk '/Xcode / {split($2,v,"."); print v[1]}')"
          test -n "$major" && test "$major" -ge 26
      - name: Install Flutter 3.47.1
        run: |
          git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Test and build iOS
        run: |
          cd apps/client
          flutter --version
          OPFIN_IOS_BUNDLE_ID=co.opfin.ci bash tool/prepare_app_store.sh
          flutter pub get
          flutter analyze
          flutter test
          flutter build ios --release --no-codesign --no-pub \
            --dart-define=OPFIN_API_BASE_URL=https://opfin-production.up.railway.app/api \
            --dart-define=OPFIN_APP_STORE_P2P_BORROWING_ENABLED=false

  release-gate:
    if: always()
    needs: [layout, repo-security, api, api-assets, web, client-android, client-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every release prerequisite to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          jobs = json.loads(os.environ['JOB_RESULTS'])
          failed = {name: job['result'] for name, job in jobs.items() if job['result'] != 'success'}
          if failed:
              print('Release blocked:', failed)
              sys.exit(1)
          print('CANONICAL_OPFIN_SHA=' + os.environ['GITHUB_SHA'])
          PY
