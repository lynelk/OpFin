name: OpFin Monorepo CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - run: sh scripts/verify-layout.sh

  api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=2 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Verify PHP and Composer
        run: |
          php -v
          composer --version
      - name: Test API
        run: |
          cd apps/api
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate
          sh scripts/enforce-cpay-only.sh
          sh scripts/run-tests.sh
          ./vendor/bin/pint --test
          composer audit

  api-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install Node 22
        run: |
          curl -fsSLO https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.xz
          tar -xJf node-v22.23.2-linux-x64.tar.xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v22.23.2-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Build API assets
        run: |
          cd apps/api
          npm ci
          npm run build

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install Node 22
        run: |
          curl -fsSLO https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.xz
          tar -xJf node-v22.23.2-linux-x64.tar.xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v22.23.2-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Test and build web
        run: |
          cd apps/web
          npm ci --legacy-peer-deps
          npm audit --audit-level=high
          npm run typecheck
          npm install --no-save --legacy-peer-deps typescript@npm:@typescript/typescript6@6.0.2
          npm run lint
          npm ci --legacy-peer-deps
          npm run test
          NEXT_PUBLIC_OPFIN_API_URL=http://localhost:8000/api NEXT_PUBLIC_USE_MOCK_API=false OPFIN_ENABLE_DEMO_SHORTCUTS=false npm run build
          if NODE_ENV=production NEXT_PUBLIC_USE_MOCK_API=true node -e "import('./next.config.mjs')"; then exit 1; fi
          if NODE_ENV=production OPFIN_ENABLE_DEMO_SHORTCUTS=true node -e "import('./next.config.mjs')"; then exit 1; fi

  client-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install Flutter 3.47.1
        run: |
          git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Test and build Android
        run: |
          cd apps/client
          flutter --version
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release --no-pub
          flutter build appbundle --release --no-pub

  client-ios:
    runs-on: macos-15
    steps:
      - name: Check out exact commit
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Select Xcode 26+
        run: |
          candidate="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -1)"
          if [[ -n "$candidate" ]]; then sudo xcode-select -s "$candidate/Contents/Developer"; fi
          xcodebuild -version
          major="$(xcodebuild -version | awk '/Xcode / {split($2,v,"."); print v[1]}')"
          test -n "$major" && test "$major" -ge 26
      - name: Install Flutter 3.47.1
        run: |
          git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Test and build iOS
        run: |
          cd apps/client
          flutter --version
          OPFIN_IOS_BUNDLE_ID=co.opfin.ci bash tool/prepare_app_store.sh
          flutter pub get
          flutter analyze
          flutter test
          flutter build ios --release --no-codesign --no-pub \
            --dart-define=OPFIN_API_BASE_URL=https://opfin-api-production.up.railway.app/api \
            --dart-define=OPFIN_APP_STORE_P2P_BORROWING_ENABLED=false

  release-gate:
    needs: [layout, api, api-assets, web, client-android, client-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Record validated canonical SHA
        run: echo "CANONICAL_OPFIN_SHA=$GITHUB_SHA"
