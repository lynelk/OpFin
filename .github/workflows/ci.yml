name: OpFin Monorepo CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify monorepo boundaries
        run: sh scripts/verify-layout.sh

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify PHP runtime
        run: |
          php -v
          composer --version
          php -m | grep -E 'mbstring|PDO|pdo_sqlite|sqlite3' || true
      - name: Prepare CI environment
        run: cp .env.example .env
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare application
        run: php artisan key:generate
      - name: Enforce CPay-only production money movement
        run: sh scripts/enforce-cpay-only.sh
      - name: Run hermetic tests
        run: sh scripts/run-tests.sh
      - name: Check PHP formatting
        run: ./vendor/bin/pint --test
      - name: Audit Composer dependencies
        run: composer audit

  api-assets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - name: Install TypeScript 6 API for ESLint
        run: npm install --no-save --legacy-peer-deps typescript@npm:@typescript/typescript6@6.0.2
      - run: npm run lint
      - run: npm ci --legacy-peer-deps
      - run: npm run test
      - name: Build production web
        env:
          NEXT_PUBLIC_OPFIN_API_URL: http://localhost:8000/api
          NEXT_PUBLIC_USE_MOCK_API: "false"
          OPFIN_ENABLE_DEMO_SHORTCUTS: "false"
        run: npm run build
      - name: Reject production mock API mode
        env:
          NODE_ENV: production
          NEXT_PUBLIC_USE_MOCK_API: "true"
        run: |
          if node -e "import('./next.config.mjs')"; then exit 1; fi
      - name: Reject production demo shortcuts
        env:
          NODE_ENV: production
          OPFIN_ENABLE_DEMO_SHORTCUTS: "true"
        run: |
          if node -e "import('./next.config.mjs')"; then exit 1; fi

  client-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - name: Install Flutter 3.47.1
        run: |
          git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --no-pub
      - run: flutter build appbundle --release --no-pub

  client-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26+
        run: |
          candidate="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -1)"
          if [[ -n "$candidate" ]]; then sudo xcode-select -s "$candidate/Contents/Developer"; fi
          xcodebuild -version
          major="$(xcodebuild -version | awk '/Xcode / {split($2,v,"."); print v[1]}')"
          test -n "$major" && test "$major" -ge 26
      - name: Install Flutter 3.47.1
        run: |
          git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - name: Configure CI bundle identifier
        env:
          OPFIN_IOS_BUNDLE_ID: co.opfin.ci
        run: bash tool/prepare_app_store.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build unsigned iOS release
        run: |
          flutter build ios --release --no-codesign --no-pub \
            --dart-define=OPFIN_API_BASE_URL=https://opfin-api-production.up.railway.app/api \
            --dart-define=OPFIN_APP_STORE_P2P_BORROWING_ENABLED=false

  release-bundle:
    needs: [layout, api, api-assets, web, client-android, client-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Package exact canonical head
        run: |
          set -Eeuo pipefail
          git branch -f main "$GITHUB_SHA"
          git bundle create "$RUNNER_TEMP/OpFin-monorepo.bundle" main
          git archive --format=tar.gz --output="$RUNNER_TEMP/OpFin-monorepo-source.tar.gz" "$GITHUB_SHA"
          sha256sum "$RUNNER_TEMP/OpFin-monorepo.bundle" "$RUNNER_TEMP/OpFin-monorepo-source.tar.gz" > "$RUNNER_TEMP/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: OpFin-monorepo-${{ github.sha }}
          path: |
            ${{ runner.temp }}/OpFin-monorepo.bundle
            ${{ runner.temp }}/OpFin-monorepo-source.tar.gz
            ${{ runner.temp }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
