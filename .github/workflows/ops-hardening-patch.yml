name: Apply operations hardening patch

on:
  push:
    branches:
      - ops/rightsize-recovery-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Finalize operations hardening patch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ops/rightsize-recovery-hardening
    steps:
      - name: Finalize scheduler hardening
        shell: bash
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=2 origin "${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('apps/api/app/Services/AutonomousOperationsService.php')
          text = p.read_text()
          text = text.replace(')-limit(self::BATCH_SIZE)', ')->limit(self::BATCH_SIZE)')
          text = re.sub(
              r"\s*// Keep summaries bounded\. Never recursively embed the previous run's JSON summary\.\s*'last_run' => Schema::hasTable\('autopilot_runs'\)\s*\? DB::table\('autopilot_runs'\)\s*->where\('status', 'completed'\)\s*->orderByDesc\('id'\)\s*->first\(\['id', 'status', 'trigger', 'started_at', 'completed_at', 'observations', 'actions_executed', 'exceptions_created'\]\)\s*: null,",
              """
            // Keep summaries bounded. Never recursively embed the previous run's JSON summary.
            'last_run' => Schema::hasTable('autopilot_runs')
                ? DB::table('autopilot_runs')
                    ->where('status', 'completed')
                    ->orderByDesc('id')
                    ->first(['id', 'status', 'trigger', 'started_at', 'completed_at', 'observations', 'actions_executed', 'exceptions_created'])
                : null,""",
              text,
              count=1,
          )
          p.write_text(text)
          PY
          php -l apps/api/app/Services/AutonomousOperationsService.php
          php -l apps/api/routes/console.php
          cd apps/api
          if [ -x vendor/bin/pint ]; then vendor/bin/pint --test app/Services/AutonomousOperationsService.php routes/console.php; fi
          cd ../..
          git config user.name "OpFin Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/app/Services/AutonomousOperationsService.php apps/api/routes/console.php
          git diff --cached --check
          git commit -m "Finalize operations hardening patch"
          git push origin "HEAD:${BRANCH}"
