name: OpFin security monitoring

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opfin-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: security-${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scope: [web, api-assets, composer, flutter, controls]
    steps:
      - name: Check out exact source without persisting a credential
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install integrity-checked Node 22
        if: matrix.scope == 'web' || matrix.scope == 'api-assets'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 -fsSLO https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.xz
          curl --proto '=https' --tlsv1.2 -fsSLO https://nodejs.org/dist/v22.23.2/SHASUMS256.txt
          grep ' node-v22.23.2-linux-x64.tar.xz$' SHASUMS256.txt | sha256sum --check --strict
          tar -xJf node-v22.23.2-linux-x64.tar.xz
          echo "$RUNNER_TEMP/node-v22.23.2-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Audit web packages without lifecycle scripts
        if: matrix.scope == 'web'
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --legacy-peer-deps
          npm audit --audit-level=high
      - name: Audit API asset packages without lifecycle scripts
        if: matrix.scope == 'api-assets'
        working-directory: apps/api
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Audit locked PHP dependencies without executing application code
        if: matrix.scope == 'composer'
        working-directory: apps/api
        run: composer audit --locked --no-interaction
      - name: Audit locked public Flutter dependencies
        if: matrix.scope == 'flutter'
        run: python3 scripts/audit-pub.py
      - name: Check repository secrets, transport controls and brand provenance
        if: matrix.scope == 'controls'
        run: |
          sh scripts/verify-repository-security.sh
          python3 scripts/sync-brand.py --check
          python3 scripts/verify-security-controls.py
      - name: Record bounded scan coverage
        if: always()
        env:
          AUDIT_SCOPE: ${{ matrix.scope }}
          AUDIT_STATUS: ${{ job.status }}
        run: |
          printf '## OpFin security: %s\n\nCommit: `%s`\n\nResult: %s\n\nA successful dependency/control scan is not a penetration test or a guarantee against unknown vulnerabilities. Any failed or incomplete scan requires review; do not bypass it.\n' "$AUDIT_SCOPE" "$GITHUB_SHA" "$AUDIT_STATUS" >> "$GITHUB_STEP_SUMMARY"

  security-gate:
    if: always()
    needs: [audit]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Block on failed, cancelled or incomplete audits
        env:
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: test "$AUDIT_RESULT" = success
