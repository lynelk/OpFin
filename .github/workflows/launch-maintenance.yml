name: Launch dependency maintenance

on:
  push:
    branches: [launch/play-store-v1-materials]
    paths: [.github/workflows/launch-maintenance.yml]

permissions:
  contents: read

concurrency:
  group: opfin-launch-maintenance
  cancel-in-progress: false

jobs:
  refresh-approved-lock:
    if: github.repository == 'lynelk/OpFin' && github.ref == 'refs/heads/launch/play-store-v1-materials'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Check out exact authorised branch commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout -b launch/play-store-v1-materials FETCH_HEAD
      - name: Install verified Node distribution
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 -fsSLO https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.xz
          curl --proto '=https' --tlsv1.2 -fsSLO https://nodejs.org/dist/v22.23.2/SHASUMS256.txt
          grep ' node-v22.23.2-linux-x64.tar.xz$' SHASUMS256.txt | sha256sum --check --strict
          tar -xJf node-v22.23.2-linux-x64.tar.xz
          echo "$RUNNER_TEMP/node-v22.23.2-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Regenerate lock without executing dependency lifecycle scripts
        run: |
          set -euo pipefail
          cd apps/web
          node -e 'const p=require("./package.json"); if(p.overrides.sharp!=="0.35.4") process.exit(1)'
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps
          node -e 'const l=require("./package-lock.json"); if(l.packages["node_modules/sharp"].version!=="0.35.4") process.exit(1)'
          npm audit --audit-level=high
      - name: Commit only the regenerated web lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unexpected=$(git diff --name-only | grep -v '^apps/web/package-lock.json$' || true)
          test -z "$unexpected"
          git add -- apps/web/package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(security): lock patched sharp dependency and native binaries'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$AUTH"
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/launch/play-store-v1-materials
          fi
          git rev-parse HEAD
          git show --stat --oneline HEAD
