name: Launch dependency maintenance

on:
  push:
    branches: [launch/play-store-v1-materials]
    paths: [.github/workflows/launch-maintenance.yml]

permissions:
  contents: read

concurrency:
  group: opfin-launch-maintenance
  cancel-in-progress: false

jobs:
  prepare-reviewed-brand:
    if: github.repository == 'lynelk/OpFin' && github.ref == 'refs/heads/launch/play-store-v1-materials'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out exact authorised branch commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout -b launch/play-store-v1-materials FETCH_HEAD
      - name: Install verified Node distribution
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 -fsSLO https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.xz
          curl --proto '=https' --tlsv1.2 -fsSLO https://nodejs.org/dist/v22.23.2/SHASUMS256.txt
          grep ' node-v22.23.2-linux-x64.tar.xz$' SHASUMS256.txt | sha256sum --check --strict
          tar -xJf node-v22.23.2-linux-x64.tar.xz
          echo "$RUNNER_TEMP/node-v22.23.2-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Install and audit reviewed asset tooling without lifecycle scripts
        run: |
          set -euo pipefail
          cd apps/web
          npm ci --ignore-scripts --legacy-peer-deps
          npm audit --audit-level=high
      - name: Generate brand assets and migrate presentation overrides
        run: |
          set -euo pipefail
          node scripts/prepare-brand-assets.mjs
          python3 scripts/sync-brand.py
          python3 scripts/migrate-brand-foundation.py
          python3 scripts/sync-brand.py --check
          python3 scripts/verify-security-controls.py
      - name: Commit only reviewed brand and CI paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = ('.github/workflows/ci.yml', 'apps/client/lib/', 'apps/client/assets/brand/', 'apps/client/pubspec.yaml', 'apps/client/android/app/src/main/res/mipmap-', 'apps/client/ios/Runner/Assets.xcassets/AppIcon.appiconset/', 'apps/web/src/app/', 'apps/web/src/components/', 'apps/web/public/brand/', 'brand/asset-manifest.json')
          paths = subprocess.check_output(['git', 'diff', '--name-only', '-z']).split(b'\0') + subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z']).split(b'\0')
          for raw in paths:
              if raw and not raw.decode().startswith(allowed):
                  raise SystemExit('Unexpected generated path: ' + raw.decode())
          PY
          git add -- .github/workflows/ci.yml apps/client/lib apps/client/assets/brand apps/client/pubspec.yaml apps/client/android/app/src/main/res apps/web/src/app apps/web/src/components apps/web/public/brand brand/asset-manifest.json
          if test -d apps/client/ios/Runner/Assets.xcassets/AppIcon.appiconset; then git add -- apps/client/ios/Runner/Assets.xcassets/AppIcon.appiconset; fi
          sh scripts/verify-repository-security.sh
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(brand): apply verified OpFin assets and shared colours across clients'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$AUTH"
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/launch/play-store-v1-materials
          fi
          git rev-parse HEAD
          git show --stat --oneline HEAD
